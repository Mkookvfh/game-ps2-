name: Build‑Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs‑on: ubuntu‑latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install compiler tools
        run: |
          sudo apt‑get update
          sudo apt‑get install ‑y gcc make

      - name: Compile project
        run: make

      - name: Run test program
        run: ./game_test
