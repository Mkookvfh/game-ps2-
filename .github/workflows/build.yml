
name: MUEANG ISARA PS2 Boot Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest

    env:
      PS2DEV: /usr/local/ps2dev
      PS2SDK: /usr/local/ps2dev/ps2sdk
      GSKIT: /usr/local/ps2dev/gsKit
      EE_CC: mips64r5900el-ps2-elf-gcc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PS2DEV
        run: |
          echo "$PS2DEV/bin" >> "$GITHUB_PATH"
          echo "$PS2DEV/ee/bin" >> "$GITHUB_PATH"
          echo "$PS2SDK/bin" >> "$GITHUB_PATH"

      - name: Verify SDK
        run: |
          set -eu
          test -f "$PS2SDK/samples/Makefile.pref"
          test -f "$PS2SDK/samples/Makefile.eeglobal"
          test -d "$GSKIT/include"
          test -d "$GSKIT/lib"
          command -v "$EE_CC"

      - name: Build ELF
        run: |
          set -eu
          make clean
          make EE_CC="$EE_CC"
          test -s MueangIsara.elf

      - name: Verify ELF
        run: |
          set -eu
          file MueangIsara.elf
          readelf -h MueangIsara.elf | grep -E 'Machine:.*MIPS'

      - name: Upload PS2 ELF
        uses: actions/upload-artifact@v4
        with:
          name: MueangIsara-PS2-Boot
          path: MueangIsara.elf
          if-no-files-found: error
