name: Build Mueang Isara PS2
on: [push]

jobs:
  build:
    runs‑on: ubuntu‑latest
    container: ghcr.io/ps2dev/ps2dev:latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build MueangIsara
        run: make

      - name: Upload MueangIsara.elf
        uses: actions/upload‑artifact@v4
        with:
          name: Mueang‑Isara‑PS2
          path: MueangIsara.elf
