name: Build Mueang Isara PS2
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs‑on: ubuntu‑latest
    container: ghcr.io/ps2dev/ps2dev:latest
    env:
      PS2DEV: /usr/local/ps2dev
      PS2SDK: /usr/local/ps2dev/ps2sdk
      GSKIT: /usr/local/ps2dev/gsKit
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install packages
        run: apk add --no‑cache make git gcc

      - name: Download & build gsKit
        run: |
          cd /usr/local/ps2dev
          git clone https://github.com/ps2dev/gsKit.git
          cd gsKit
          make
          make install

      - name: Compile project
        run: gmake

      - name: Upload compiled ELF
        uses: actions/upload‑artifact@v4
        with:
          name: ps2_game
          path: MueangIsara.elf
