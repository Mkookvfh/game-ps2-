name: Build PS2 game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile with PS2SDK and gsKit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build gsKit and game with PS2SDK
        shell: bash
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src ps2dev/ps2dev:latest sh -lc '
            apk add --no-cache make git cmake
            export PS2DEV="${PS2DEV:-/usr/local/ps2dev}"
            export PS2SDK="${PS2SDK:-$PS2DEV/ps2sdk}"
            export GSKIT="$PS2DEV/gsKit"
            export PATH="$PS2DEV/ee/bin:$PS2DEV/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH"

            if [ ! -d "$GSKIT/.git" ]; then
              git clone --depth 1 https://github.com/ps2dev/gsKit.git "$GSKIT"
            fi
            cd "$GSKIT"
            make
            make install
            cd /src

            command -v mips64r5900el-ps2-elf-gcc
            test -f src/main.c
            make clean
            make -j2
            test -s MueangIsara.elf
            file MueangIsara.elf || true
          '

      - name: Package OPL test files
        if: success()
        shell: bash
        run: |
          mkdir -p opl-package
          cp MueangIsara.elf opl-package/
          cat > opl-package/README.txt <<'EOF'
          Mueang Isara PS2 prototype
          Copy MueangIsara.elf to a USB drive formatted as FAT32.
          This ELF is a homebrew test executable; it is not a full OPL game ISO.
          Launch through a compatible ELF launcher/uLaunchELF, or package as an OPL-supported format later.
          EOF
          (cd opl-package && zip -r ../MueangIsara-PS2-USB-test.zip .)

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mueang-isara-ps2-build
          path: |
            MueangIsara.elf
            MueangIsara-PS2-USB-test.zip
          if-no-files-found: warn
          retention-days: 14
