
name: Build Mueang Isara PS2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ps2dev/ps2dev:latest
    env:
      PS2DEV: /usr/local/ps2dev
      PS2SDK: /usr/local/ps2dev/ps2sdk
      GSKIT: /usr/local/ps2dev/gsKit

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Git
        shell: sh
        run: |
          if ! command -v git >/dev/null 2>&1; then
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache git
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y git
            elif command -v pacman >/dev/null 2>&1; then
              pacman -Sy --noconfirm git
            else
              echo "No supported package manager"
              exit 1
            fi
          fi
          git --version

      - name: Install gsKit
        shell: sh
        run: |
          if [ ! -d "$GSKIT/.git" ]; then
            mkdir -p "$(dirname "$GSKIT")"
            git clone --depth 1 https://github.com/ps2dev/gsKit.git "$GSKIT"
          fi
          cd "$GSKIT"
          make
          make install

      - name: Build PS2 ELF
        shell: sh
        run: make clean && make

      - name: Verify PS2 ELF
        run: |
          test -s MueangIsara.elf
          file MueangIsara.elf || true
          ls -lh MueangIsara.elf

      - name: Upload PS2 build
        uses: actions/upload-artifact@v4
        with:
          name: MueangIsara-PS2
          path: MueangIsara.elf
          if-no-files-found: error
