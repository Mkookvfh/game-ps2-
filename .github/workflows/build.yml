name: Build‑Test
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs‑on: ubuntu‑latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt update
          sudo apt install -y gcc make

      - name: List src files
        run: ls -la src/

      - name: Compile
        run: make

      - name: Run test
        run: ./game_test
