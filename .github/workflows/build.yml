
name: MUEANG ISARA PS2 Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest

    env:
      PS2DEV: /usr/local/ps2dev
      PS2SDK: /usr/local/ps2dev/ps2sdk
      GSKIT: /usr/local/ps2dev/gsKit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PS2DEV
        run: |
          echo "$PS2DEV/bin" >> $GITHUB_PATH
          echo "$PS2DEV/ee/bin" >> $GITHUB_PATH
          echo "$PS2SDK/bin" >> $GITHUB_PATH

            - name: Verify SDK
        run: |
          set -e
          test -f "$PS2SDK/samples/Makefile.pref"
          test -f "$PS2SDK/samples/Makefile.eeglobal"
          test -d "$GSKIT/include"
          test -d "$GSKIT/lib"
          command -v mips64r5900el-ps2-elf-gcc

      - name: Build ELF
        run: |
          make clean
          make

      - name: Verify ELF
        run: |
          test -s MueangIsara.elf
          file MueangIsara.elf

      - name: Upload PS2 ELF
        uses: actions/upload-artifact@v4
        with:
          name: MueangIsara-PS2
          path: MueangIsara.elf
          if-no-files-found: error
