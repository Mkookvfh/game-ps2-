name: Unity Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/project-western-unity-foundation"
    paths:
      - "Unity/ProjectWestern/**"
      - ".github/workflows/unity-android-build.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity/ProjectWestern
          targetPlatform: Android
          buildsPath: build
          buildName: ProjectWestern
          versioning: Semantic

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectWestern-Android
          path: build/Android/**/*.apk
          if-no-files-found: error
          retention-days: 14
